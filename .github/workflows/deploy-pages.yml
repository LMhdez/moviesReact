name: Deploy Movies React to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published frontend
        env:
          SITE_URL: https://lmhdez.github.io/moviesReact/
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          status="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$SITE_URL")"
          if [ "$status" != "200" ]; then
            echo "GitHub Pages root returned HTTP $status"
            exit 1
          fi
          if ! grep -q '/moviesReact/assets/' "$body"; then
            echo "Published HTML does not reference the expected project asset path"
            exit 1
          fi
          echo "GitHub Pages root: HTTP 200; project asset base confirmed"

          route_status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "${SITE_URL}movies/route-smoke-test")"
          if [ "$route_status" != "404" ] || ! grep -q 'gh-pages-route' "$body"; then
            echo "React Router fallback is missing or unexpected (HTTP $route_status)"
            exit 1
          fi
          echo "Client-side route fallback: 404.html contains route restoration"

      - name: Smoke test Azure Functions API and CORS
        env:
          API_BASE: https://moviesfunctionapp.azurewebsites.net/api
          FRONTEND_ORIGIN: https://lmhdez.github.io
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT

          for endpoint in GetHeadline GetMovies GetGenres GetReviews; do
            status="$(curl --silent --show-error --max-time 25 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              --header "Origin: $FRONTEND_ORIGIN" "$API_BASE/$endpoint")"
            if [ "$status" != "200" ]; then
              echo "$endpoint returned HTTP $status"
              exit 1
            fi
            if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*(https://lmhdez\.github\.io|\*)' "$headers"; then
              echo "$endpoint does not allow the GitHub Pages origin through CORS"
              exit 1
            fi
            echo "$endpoint: HTTP 200; CORS origin allowed"
          done

          status="$(curl --silent --show-error --max-time 25 --request OPTIONS --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
            --header "Origin: $FRONTEND_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "$API_BASE/SubmitReview")"
          case "$status" in
            200|204) ;;
            *) echo "SubmitReview CORS preflight returned HTTP $status"; exit 1 ;;
          esac
          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*(https://lmhdez\.github\.io|\*)' "$headers"; then
            echo "SubmitReview preflight does not allow the GitHub Pages origin"
            exit 1
          fi
          if ! grep -Eiq '^access-control-allow-methods:.*POST' "$headers"; then
            echo "SubmitReview preflight does not allow POST"
            exit 1
          fi
          if ! grep -Eiq '^access-control-allow-headers:.*content-type' "$headers"; then
            echo "SubmitReview preflight does not allow the content-type header"
            exit 1
          fi
          echo "SubmitReview: preflight permits POST with content-type"
