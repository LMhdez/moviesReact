name: Deploy Movies React to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint (non-blocking baseline check)
        continue-on-error: true
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published frontend
        env:
          SITE_URL: https://lmhdez.github.io/moviesReact/
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          status="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$SITE_URL")"
          if [ "$status" != "200" ]; then
            echo "GitHub Pages root returned HTTP $status"
            exit 1
          fi
          if ! grep -q '/moviesReact/assets/' "$body"; then
            echo "Published HTML does not reference the expected project asset path"
            exit 1
          fi
          echo "GitHub Pages root: HTTP 200; project asset base confirmed"

          route_status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "${SITE_URL}movies/route-smoke-test")"
          if [ "$route_status" != "404" ] || ! grep -q 'gh-pages-route' "$body"; then
            echo "React Router fallback is missing or unexpected (HTTP $route_status)"
            exit 1
          fi
          echo "Client-side route fallback: 404.html contains route restoration"
      - name: Validate Cinemeta movie metadata API
        env:
          CATALOG_URL: https://cinemeta-catalogs.strem.io/top/catalog/movie/top.json
          META_URL: https://v3-cinemeta.strem.io/meta/movie/tt0111161.json
          FRONTEND_ORIGIN: https://lmhdez.github.io
        run: |
          set -uo pipefail
          for target in catalog metadata; do
            if [ "$target" = "catalog" ]; then url="$CATALOG_URL"; else url="$META_URL"; fi
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 25 --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              --header "Origin: $FRONTEND_ORIGIN" "$url" 2>/dev/null || true)"
            if [ "$status" = "200" ] && grep -Eiq '^access-control-allow-origin:[[:space:]]*(https://lmhdez\.github\.io|\*)' "$headers"; then
              if node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(process.argv[2]==="catalog" ? !Array.isArray(d.metas) : !d.meta) process.exit(1)' "$body" "$target"; then
                echo "Cinemeta $target endpoint: HTTP 200; JSON shape and CORS passed"
              else
                echo "Cinemeta $target endpoint: HTTP 200 but unexpected JSON shape"
                exit 1
              fi
            else
              echo "Cinemeta $target endpoint: HTTP $status or CORS not allowed"
              exit 1
            fi
            rm -f "$body" "$headers"
          done
